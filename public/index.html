<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="page-ver" content="__PAGE_VER__">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">
<title>Kimi Code 会话看板</title>
<script>
/* 设备形态识别（按 UA + 触点/屏幕兜底）：html 类 is-pad / is-phone 供 CSS 差异化 */
(function () {
  var ua = navigator.userAgent || '';
  var touch = (navigator.maxTouchPoints || 0) > 1;
  var pad = /iPad|Tablet/i.test(ua)
    || ((/Android|HarmonyOS|OpenHarmony/i.test(ua)) && !/Mobile|Phone/i.test(ua))
    || (/Macintosh/i.test(ua) && touch);                        // iPadOS 桌面 UA
  var phone = !pad && touch && Math.min(screen.width, screen.height) <= 500;
  if (pad) document.documentElement.classList.add('is-pad');
  else if (phone) document.documentElement.classList.add('is-phone');
})();
</script>
<style>
  :root {
    /* Kimi web 设计令牌（亮色） */
    --bg0: #ffffff;
    --panel: #f9fbfc;
    --card: #ffffff;
    --card-idle: #f4f6f8;
    --side: #f9fbfc;
    --text: rgba(0, 0, 0, .9);
    --dim: rgba(0, 0, 0, .6);
    --faint: rgba(0, 0, 0, .45);
    --border: rgba(0, 0, 0, .13);
    --border-hi: rgba(0, 0, 0, .18);
    --accent: #1783ff;
    --accent2: #0b62c4;   /* 品牌蓝深一档 */
    --task-prefix: #8250df;
    --green: #1783ff;      /* 运行中/在线：kimi info 蓝 */
    --yellow: #bc4c00;     /* 待确认：kimi orange */
    --red: #c0392b;        /* 僵死/错误：kimi danger */
    --gray: rgba(0, 0, 0, .45);
    --accent-soft: #e8f3ff;
    --orange-soft: #fff1e5;
    --done-soft: #f3e8ff;
    --red-soft: rgba(192, 57, 43, .1);
    --card-running: #e8f3ff;
    --card-done: #f3e8ff;
    --card-waiting: #fff1e5;
    --card-stale: rgba(192, 57, 43, .12);
    --bd-running: rgba(23, 131, 255, .35);
    --bd-waiting: rgba(188, 76, 0, .35);
    --bd-stale: rgba(192, 57, 43, .35);
    --hover: rgba(0, 0, 0, .04);
    --shadow-panel: 0 5px 16px -4px rgba(0, 0, 0, .07);
    --shadow-pop: 0 12px 32px rgba(16, 24, 40, .12), 0 4px 10px rgba(16, 24, 40, .08);
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg0: #121212;
      --panel: #1f1f1f;
      --card: #3a3a3a;
      --card-idle: #191919;
      --side: #0d0d0d;
      --text: rgba(255, 255, 255, .95);
      --dim: rgba(255, 255, 255, .7);
      --faint: rgba(255, 255, 255, .55);
      --border: rgba(255, 255, 255, .2);
      --border-hi: rgba(255, 255, 255, .28);
      --accent: #1a88ff;
      --accent2: #6fb4ff;
      --task-prefix: #bd9cff;
      --green: #1a88ff;
      --yellow: #f0883e;
      --red: #f85149;
      --gray: rgba(255, 255, 255, .55);
      --accent-soft: rgba(26, 136, 255, .1);
      --orange-soft: rgba(240, 136, 62, .14);
      --done-soft: rgba(163, 113, 247, .24);
      --red-soft: rgba(248, 81, 73, .14);
      --card-running: rgba(26, 136, 255, .2);
      --card-waiting: rgba(240, 136, 62, .24);
      --card-stale: rgba(248, 81, 73, .2);
      --bd-running: rgba(26, 136, 255, .42);
      --bd-waiting: rgba(240, 136, 62, .45);
      --bd-stale: rgba(248, 81, 73, .4);
      --hover: rgba(255, 255, 255, .05);
      --shadow-panel: 0 4px 12px rgba(0, 0, 0, .3);
      --shadow-pop: 0 12px 32px rgba(0, 0, 0, .34), 0 4px 10px rgba(0, 0, 0, .28);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: light dark; overflow: hidden; }
  body > * { position: relative; z-index: 1; }
  body {
    height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column; gap: 8px;
    padding: 8px 12px 10px;
    background: var(--bg0);
    color: var(--text);
    font: 13px/1.45 "Schibsted Grotesk Variable", "Helvetica Neue", Arial, "PingFang SC", "Noto Sans SC", -apple-system, "Microsoft YaHei", sans-serif;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-panel);
  }
  ::-webkit-scrollbar { display: none; }
  #tiles-head, .side h3, #st-tabs > b, .sum-card[data-card], .add-btn, .todo-item, .group-head, .hdr-btn { touch-action: manipulation; }
  * { scrollbar-width: none; -ms-overflow-style: none; }

  header {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 6px 16px;
  }
  h1 {
    font-size: 15px; font-weight: 700; letter-spacing: .02em;
    color: var(--text);
    display: inline-flex; align-items: center; gap: 0;
  }
  /* Kimi Code 品牌字标：KIMI 主文字色 + 〈Code〉品牌蓝 */
  .wm-kimi { color: var(--text); font-weight: 800; }
  .wm-code { color: var(--accent); font-weight: 800; margin-left: 6px; }
  .wm-board { color: var(--text); font-weight: 700; margin-left: 8px; }
  #updated { color: var(--dim); font-size: 10.5px; font-family: var(--mono); margin-left: auto; }
  /* 宽度不足（竖屏）时隐藏推送状态小尾巴 */
  .push-tag { display: inline; }
  .live { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); font-size: 10px; }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  .summary { flex: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .sum-card { padding: 6px 12px; position: relative; overflow: hidden; }
  /* 待办胶囊：仅窄左侧/手机显示（宽屏由右侧栏展示待办） */
  .todo-chip { display: none; flex: none; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); color: var(--dim); font-size: 11px; cursor: pointer; }
  .todo-chip b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .todo-chip:hover { color: var(--text); border-color: var(--border-hi); }
  .sum-card[data-card] { cursor: pointer; }
  .sum-card[data-card]:hover { border-color: var(--border-hi); }
  /* 指标卡浮层（Token / 轮次详情） */
  .pop-overlay { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: none; align-items: center; justify-content: center; }
  .pop-overlay.open { display: flex; }
  .pop { width: min(560px, 94vw); max-height: 80vh; overflow-y: auto; padding: 16px 18px; position: relative; }
  .pop h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; padding-right: 30px; }
  .pop .close { position: absolute; top: 8px; right: 12px; cursor: pointer; color: var(--dim); font-size: 18px; line-height: 1; }
  .pop .close:hover { color: var(--text); }
  .pop h4 { font-size: 11px; color: var(--dim); margin: 14px 0 8px; letter-spacing: .05em; }
  .pop .bars { display: flex; align-items: flex-end; gap: 3px; height: 64px; }
  .pop .bars i { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
  .pop .srow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11.5px; cursor: pointer; min-width: 0; }
  .pop .srow:hover .nm { color: var(--accent); }
  .pop .srow .nm { flex: none; width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop .srow .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .pop .srow .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .pop .srow .v { flex: none; color: var(--dim); font-family: var(--mono); font-size: 10.5px; white-space: nowrap; }
  .pop .empty2 { color: var(--dim); text-align: center; padding: 16px 0; font-size: 12px; }
  .add-btn { flex: none; color: var(--accent); font-size: 11px; cursor: pointer; margin-left: 8px; user-select: none; }
  .add-btn:hover { text-decoration: underline; }
  .pop .todo-input { width: 100%; box-sizing: border-box; height: 40px; border: 1px solid var(--border-hi); border-radius: 8px; background: var(--card); color: var(--text); padding: 0 12px; font-size: 13px; margin-bottom: 10px; outline: none; }
  .pop .todo-input:focus { border-color: var(--accent); }
  .pop .todo-submit { width: 100%; height: 36px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; }
  .pop .todo-submit:disabled { opacity: .6; cursor: default; }
  .pop .todo-err { color: var(--red); font-size: 11px; margin-top: 8px; min-height: 14px; }
  #pop-todo-list { max-height: 55vh; overflow-y: auto; margin-bottom: 10px; }
  /* 网络上下行箭头：下行绿、上行红 */
  .net-down { color: #16a34a; }
  .net-up { color: var(--red); }
  @media (prefers-color-scheme: dark) {
    .net-down { color: #3fb950; }
  }
  /* ---- 左右分屏：右侧常驻会话面板，分隔条可拖拽调宽 ---- */
  .split { flex: 1; min-height: 0; display: flex; gap: 8px; }
  .dash { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px; container: dash / inline-size; }
  .sp-divider { flex: none; position: relative; width: 4px; margin-inline: -5px; cursor: col-resize; }
  .sp-divider::before { content: ""; position: absolute; left: 1px; right: 1px; top: 50%; height: 56px; transform: translateY(-50%); border-radius: 2px; background: var(--border); transition: background .15s; }
  .sp-divider:hover::before, .sp-divider.drag::before { background: var(--accent); }
  .session-pane {
    position: relative;
    flex: none; width: var(--spw, 42%); min-width: 300px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow-panel);
    display: flex; flex-direction: column; overflow: hidden;
  }
  body.sp-collapsed .sp-divider, body.sp-collapsed .session-pane { display: none; }
  .sp-mclose { position: absolute; top: 8px; right: 8px; z-index: 2; width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 50%; background: var(--panel); color: var(--dim); cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 13px; }
  .sp-mclose:hover { color: var(--text); border-color: var(--border-hi); }
  .sp-loading { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--dim); font-size: 13px; background: var(--bg0); }
  .sp-loading .spin { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spspin .8s linear infinite; }
  @keyframes spspin { to { transform: rotate(360deg); } }
  .sp-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 13px; }
  .sp-tabbar { flex: none; display: none; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .sp-tab { display: inline-flex; align-items: center; gap: 6px; max-width: 200px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 8px; font-size: 11px; color: var(--dim); cursor: pointer; white-space: nowrap; flex: none; }
  .sp-tab.on { color: var(--accent); border-color: rgba(23, 131, 255, .4); background: var(--accent-soft); }
  .sp-tab .tt { overflow: hidden; text-overflow: ellipsis; }
  .sp-tab .x { flex: none; color: var(--faint); }
  .sp-tab .x:hover { color: var(--red); }
  .sp-tabbody { flex: 1; min-width: 0; position: relative; }
  .sp-tabview { position: absolute; inset: 0; display: none; }
  .sp-tabview.on { display: block; }
  .sp-tabview .sp-iframe { width: 100%; height: 100%; border: none; background: var(--bg0); }
  .sp-tabview.on { display: flex; flex-direction: column; }
  .sp-fhead { flex: none; display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--border); background: var(--bg0); }
  .sp-fhead .fp { flex: 1; min-width: 0; color: var(--dim); font-size: 10.5px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-fhead .sw { flex: none; display: inline-flex; gap: 4px; }
  .sp-fhead .sw b, .sp-fhead .dl, .sp-fhead .cls { font-weight: 500; font-size: 10.5px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 8px; color: var(--dim); cursor: pointer; user-select: none; }
  .sp-fhead .sw b.on { color: var(--accent); border-color: rgba(23, 131, 255, .4); background: var(--accent-soft); }
  .sp-fhead .dl:hover, .sp-fhead .cls:hover { color: var(--accent); background: var(--hover); }
  .sp-fhead .cls { color: var(--text); }
  .sp-fbody { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; background: var(--bg0); }
  /* 文件标签激活时隐藏悬浮 ✕（关闭已在头部「下载」后） */
  .session-pane.sp-filetab .sp-mclose { display: none !important; }
  .fb-row .fb-caret { display: inline-block; transition: transform .15s; }
  /* 会话面板全屏：隐藏左侧看板，会话面板占满；文件预览分栏同步隐藏（文件走右侧标签） */
  body.sp-full .dash, body.sp-full .sp-divider { display: none; }
  body.sp-full .session-pane { width: auto; flex: 1; min-width: 0; }
  #sp-term-btn { position: absolute; top: 7px; right: 34px; width: 24px; height: 24px; z-index: 3;
    border: none; background: none; color: var(--dim); cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; border-radius: 6px; }
  #sp-term-btn:hover { color: var(--accent); background: var(--hover); }
  #sp-term-btn svg { width: 14px; height: 14px; }
  .sp-term { flex: 1; min-height: 0; background: #121212; padding: 4px 8px; overflow: hidden; }
  .term-divider { flex: none; position: relative; width: 4px; margin-inline: -5px; cursor: col-resize; display: none; }
  .term-divider::before { content: ""; position: absolute; left: 1px; right: 1px; top: 50%; height: 56px; transform: translateY(-50%); border-radius: 2px; background: var(--border); transition: background .15s; }
  .term-divider:hover::before, .term-divider.drag::before { background: var(--accent); }
  body.term-open .term-divider { display: block; }
  .term-pane { position: relative; flex: none; width: var(--tmw, 480px); min-width: 280px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow-panel); display: none; flex-direction: column; overflow: hidden; }
  body.term-open .term-pane { display: flex; }
  /* 终端标签栏：复用会话面板 sp-tabbar 样式（高度一致）；底色用主题色，与状态栏区域/终端正文融为一体 */
  #term-tabbar { padding-right: 8px; align-items: center; background: #121212; }
  #term-add { flex: none; height: 24px; padding: 0 9px; font-size: 12px; line-height: 1; display: inline-flex; align-items: center; color: var(--dim); cursor: pointer; border: 1px dashed var(--border); border-radius: 8px; user-select: none; }
  #term-add:hover { color: var(--accent); border-color: rgba(23, 131, 255, .4); }
  #term-hide { flex: none; height: 24px; padding: 0 9px; font-size: 11px; line-height: 1; display: inline-flex; align-items: center; color: var(--dim); cursor: pointer; user-select: none; }
  #term-hide:hover { color: var(--red); }
  .term-tabbar .t-flex { flex: 1; }
  /* 触控端：终端独占整屏（覆盖在会话面板之上） */
  html.is-pad .term-pane, html.is-phone .term-pane { position: fixed; inset: 0; z-index: 95;
    width: 100vw !important; min-width: 0; border: none; border-radius: 0; }
  html.is-pad #term-divider, html.is-phone #term-divider { display: none !important; }
  #sp-menu-btn { position: absolute; top: 7px; right: 8px; width: 24px; height: 24px; z-index: 3;
    border: none; background: none; color: var(--dim); cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; border-radius: 6px; }
  #sp-menu-btn:hover { color: var(--accent); background: var(--hover); }
  #sp-menu-btn svg { width: 14px; height: 14px; }
  .sp-tabbar { padding-right: 64px; }
  /* 触控端（pad/手机）：会话面板独占整屏，单视图无标签条 */
  html.is-pad .session-pane, html.is-phone .session-pane { position: fixed; inset: 0; z-index: 90;
    width: 100vw !important; min-width: 0; border: none; border-radius: 0; display: none; }
  html.is-pad .session-pane.open, html.is-phone .session-pane.open { display: flex; }
  html.is-pad .sp-divider, html.is-phone .sp-divider,
  html.is-pad .sp-tabbar, html.is-phone .sp-tabbar,
  html.is-pad #sp-menu-btn, html.is-phone #sp-menu-btn { display: none !important; }
  /* 触控端：隐藏关闭悬浮钮，返回靠系统边缘滑动手势（history 后退） */
  html.is-pad .sp-mclose, html.is-phone .sp-mclose { display: none !important; }
  /* 触控端会话视图：隐藏终端悬浮钮（终端入口在列表头部），避免叠在会话页头部上 */
  html.is-pad #sp-term-btn, html.is-phone #sp-term-btn { display: none !important; }
  /* 触控端终端：恢复标签栏（＋/关签/隐藏），列表头终端入口仅触控显示 */
  html.is-pad #term-tabbar, html.is-phone #term-tabbar { display: flex !important; }
  #dash-term-btn { display: none; }
  html.is-pad #dash-term-btn, html.is-phone #dash-term-btn { display: inline-flex; }
  #sp-menu { position: absolute; top: 34px; right: 8px; z-index: 40; background: var(--panel);
    border: 1px solid var(--border-hi); border-radius: 10px; box-shadow: var(--shadow-pop);
    padding: 4px; display: none; min-width: 132px; }
  #sp-menu.open { display: block; }
  #sp-menu div { padding: 7px 14px; font-size: 12px; color: var(--text); cursor: pointer; border-radius: 6px; white-space: nowrap; }
  #sp-menu div:hover { background: var(--hover); }
  /* 窄屏：分屏让位为全屏覆盖 */
  @media (max-width: 900px) {
    .sp-divider { display: none; }
    .sp-mclose { display: inline-flex; }
    .session-pane { position: fixed; inset: 0; z-index: 90; width: 100vw; min-width: 0; border: none; border-radius: 0; display: none; }
    .session-pane.open { display: flex; }
  }
  .sum-card .k { color: var(--dim); font-size: 10px; letter-spacing: .08em; }
  .sum-card .v { font-size: 19px; font-weight: 700; font-family: var(--mono); font-variant-numeric: tabular-nums; line-height: 1.25; }
  .sum-card .sub { color: var(--dim); font-size: 10px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .layout {
    flex: 1; min-height: 0;
    display: grid; gap: 8px;
    /* 右列宽度 = 顶部 4 张指标卡片单张宽度，保证上下边缘对齐 */
    grid-template-columns: minmax(0, 1fr) calc((100% - 24px) / 4);
  }
  #tilesbox { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  #tiles-head { flex: none; }
  /* 标题栏统一编排：手机/竖屏 = 标题+切换+计数 / 筛选标签整行；
     pad 横屏与 PC = 标题+筛选标签+切换+计数同一行 */
  .ws-dd { order: 1; position: relative; flex: none; margin-left: 8px; }
  .ws-select { min-width: 124px; max-width: 160px; height: 24px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font-size: 11px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer; }
  .ws-select > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-select:hover { border-color: var(--border-hi); }
  .ws-select .caret { flex: none; color: var(--dim); transition: transform .15s; }
  .ws-dd.open .caret { transform: rotate(180deg); }
  .ws-dd.open .ws-select { border-color: var(--border-hi); }
  .ws-menu { display: none; position: absolute; top: calc(100% + 4px); left: 0; min-width: 100%; width: max-content; max-width: 240px; max-height: 280px; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-pop); padding: 4px; z-index: 60; }
  .ws-dd.open .ws-menu { display: block; }
  .ws-opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 10px; font-size: 11px; color: var(--text); cursor: pointer; border-radius: 6px; white-space: nowrap; }
  .ws-opt:hover { background: var(--hover); }
  .ws-opt.on { color: var(--accent); background: var(--accent-soft); }
  .ws-opt .ck { flex: none; font-size: 10px; }
  #tiles-head .r { order: 3; margin-left: auto; white-space: nowrap; }
  .hdr-btn { flex: none; width: 26px; height: 26px; border: none; background: none; color: var(--dim); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin-left: 8px; border-radius: 8px; }
  .hdr-btn:hover { color: var(--accent); }
  .hdr-btn.on { color: var(--accent); }
  .hdr-btn svg { width: 15px; height: 15px; }
  /* 右侧面板整体隐藏：会话列表占满整行 */
  body.side-hidden .layout { grid-template-columns: minmax(0, 1fr) !important; }
  body.side-hidden .side { display: none; }
  #st-tabs { order: 4; flex: 1 0 100%; padding: 6px 0 0; }
  /* 状态筛选标签（位于标题栏内，默认整行折到标题下方） */
  #st-tabs { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
  #st-tabs > b {
    font-weight: 500; font-size: 11px; padding: 3px 10px; height: 24px; display: inline-flex; align-items: center;
    border: 1px solid var(--border); border-radius: 14px;
    color: var(--dim); cursor: pointer; user-select: none;
    font-variant-numeric: tabular-nums;
  }
  #st-tabs > b:hover { color: var(--text); }
  #st-tabs > b.on { background: var(--accent-soft); color: var(--accent); border-color: rgba(23, 131, 255, .4); }
  #st-tabs > b i { font-style: normal; opacity: .75; margin-left: 3px; }
  #st-tabs > b:empty i { display: none; }
  .tiles {
    flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 10px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    grid-auto-rows: minmax(150px, auto); gap: 8px; align-content: start;
    /* 滚动交由合成器线程接管：主线程被 SSE 渲染占用时滚动仍不掉帧 */
    will-change: scroll-position;
    overscroll-behavior: contain;
  }
  .side { overflow: hidden; }
  .group { margin-bottom: 10px; }
  .group:last-child { margin-bottom: 0; }
  .group-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11.5px; font-weight: 650; color: var(--dim);
    letter-spacing: .05em; margin: 2px 2px 6px;
    cursor: pointer; user-select: none;
  }
  .group-head:hover { color: var(--text); }
  /* 分组名超长时省略号截断，右侧描述（N 会话 · 最近）始终保持在同一行右侧 */
  .group-head > span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-head .n { flex: none; white-space: nowrap; }
  .group-head .chev { display: inline-block; transition: transform .2s; color: var(--dim); }
  .group.collapsed .chev { transform: rotate(-90deg); }
  .group.collapsed .group-grid { display: none; }
  .group-head .n { color: var(--dim); font-size: 10px; font-weight: 400; font-family: var(--mono); }
  .group-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    grid-auto-rows: 168px;
    gap: 8px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
    transition: border-color .15s, background-color .15s; min-width: 0;
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
    contain: layout paint style;
  }
  .card:hover { border-color: var(--border-hi); }
  .card .badge {
    position: absolute; top: 7px; right: 8px;
    font-size: 9px; font-family: var(--mono); letter-spacing: .06em;
    color: var(--gray); display: inline-flex; align-items: center; gap: 4px;
  }
  .card .badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .card.running { background: var(--card-running); border-color: var(--bd-running); }
  .card.idle { background: var(--card-idle); }
  .card.running .badge { color: var(--accent); }
  .card.waiting { background: var(--card-waiting); border-color: var(--bd-waiting); }
  .card.waiting .badge { color: var(--yellow); }
  .card.stale { opacity: .75; background: var(--card-stale); border-color: var(--bd-stale); }
  .card.stale .badge { color: var(--red); }
  .card.completed { background: rgba(163, 113, 247, .26); border-color: rgba(163, 113, 247, .55); }
  /* 当前在右侧面板打开的会话卡片：品牌蓝描边 */
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 2px 8px rgba(0, 0, 0, .12); }
  @media (prefers-color-scheme: light) {
    .card.completed { background: var(--card-done, var(--done-soft)); border-color: rgba(130, 80, 223, .4); }
  }
  .card.completed .badge { color: var(--task-prefix); }
  .card-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .card .title {
    font-weight: 600; font-size: 12.5px; margin-bottom: 3px; word-break: break-all;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    padding-right: 52px;
  }
  .card .meta { color: var(--dim); font-size: 10.5px; word-break: break-all; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips .tokens { color: var(--accent); font-size: 10px; font-family: var(--mono); font-variant-numeric: tabular-nums; margin-right: 2px; }
  .chips { display: flex; gap: 5px; flex-wrap: nowrap; overflow: hidden; margin-top: 4px; min-width: 0; align-items: center; flex-shrink: 0; }
  .chips > * { flex: 0 0 auto; white-space: nowrap; }
  .chips .chip.model { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; font-size: 9.5px; color: var(--dim); border: 1px solid var(--border); border-radius: 9px; background: var(--hover); font-family: var(--mono); }
  .chip.on { color: var(--accent2); border-color: rgba(23, 131, 255, .4); }
  .chip.model { color: var(--accent); border-color: rgba(23, 131, 255, .4); }
  .ctxline { display: flex; justify-content: space-between; align-items: baseline; margin-top: 5px; font-size: 10px; color: var(--dim); font-family: var(--mono); }
  .ctxline b { color: var(--text); font-weight: 600; font-size: 10.5px; }
  .ctxwrap { margin-top: auto; padding-top: 4px; }
  .task-line { font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; margin-bottom: 7px; }
  .task-line b { color: var(--task-prefix); font-weight: 550; }
  .ctxbar { height: 3px; border-radius: 2px; background: var(--border); margin-top: 6px; overflow: hidden; }
  .ctxbar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
  .ctxbar i.hot { background: var(--red); }

  /* 底部横向三等分：上下文 / 今日 / 累计 */
  .trio { display: flex; gap: 22px; align-items: flex-start; background: var(--hover); border-radius: 6px; padding: 5px 9px; margin-top: 0; }
  .trio-col { flex: 1 1 0; min-width: 0; }
  .trio-col { position: relative; }
  .trio-col + .trio-col::before { content: ""; position: absolute; left: -11px; top: 15%; height: 70%; border-left: 1px dashed var(--border-dim, rgba(148, 163, 184, .25)); }
  .trio-col .k { color: var(--dim); font-size: 9px; margin-bottom: 2px; }
  .trio-col .v { color: var(--text); font-size: 10px; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trio-col .ctxbar { margin-top: 3px; }
  .approval { background: var(--orange-soft); border: 1px solid rgba(240, 136, 62, .35); border-radius: 8px; padding: 5px 8px; margin-top: 5px; flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 3px; min-height: 0; }
  .approval + .approval { margin-top: 5px; }
  .approval-head { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .approval-head .paic { flex: none; }
  .approval-head .tool { color: var(--yellow); font-weight: 650; font-size: 10.5px; font-family: var(--mono); }
  .approval-head .wt { margin-left: auto; color: var(--dim); font-size: 9.5px; font-family: var(--mono); }
  .approval .action { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; font-size: 10.5px; opacity: .9; line-height: 1.4; }
  .approval .wait { color: var(--dim); font-size: 10px; margin-top: 2px; font-family: var(--mono); }
  .empty { color: var(--dim); font-size: 11.5px; text-align: center; padding: 24px 0; grid-column: 1 / -1; }

  .side { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .side .panel { padding: 8px 12px; min-height: 0; display: flex; flex-direction: column; }
  .side h3 { font-size: 11.5px; font-weight: 650; margin-bottom: 6px; color: var(--dim); letter-spacing: .04em; display: flex; justify-content: flex-start; align-items: baseline; flex: none; }
  .side h3 .n { color: var(--dim); font-size: 10px; font-weight: 400; font-family: var(--mono); }
  /* 面板标题省略号截断，窄栏（pad 横屏 1/4）下不换行 */
  .side h3 .t2 { flex: 0 1 auto; min-width: 0; max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 标题后的小字/切换按钮/折叠按钮统一靠右：小字与按钮相邻，不再被 space-between 撑开 */
  .side h3 > .n { margin-left: auto; }
  .side h3 > .rank-sw { margin-left: auto; }
  .trend-panel { flex: none; }
  .trend-body { flex: 1; overflow-y: auto; }
  .todo-panel, .tool-panel { flex: 1 1 0; }
  .panel-scroll { flex: 1; min-height: 0; overflow-y: auto; }

  .trend-svg { display: block; width: 100%; height: 44px; cursor: crosshair; }
  .axis { position: relative; height: 13px; margin-top: 2px; font-family: var(--mono); font-size: 9px; color: var(--dim); }
  .axis span { position: absolute; top: 0; }
  #pull-tip {
    position: fixed; top: 10px; left: 50%; z-index: 45;
    transform: translate(-50%, -70px);
    transition: transform .25s ease;
    background: var(--panel); border: 1px solid var(--border-hi);
    border-radius: 20px; padding: 6px 18px;
    font-family: var(--mono); font-size: 12px; color: var(--text);
    box-shadow: var(--shadow-pop); white-space: nowrap;
    pointer-events: none;
  }
  #pull-tip.visible { transform: translate(-50%, 0); }
  #pull-tip.ready { color: var(--accent); border-color: var(--accent); }
  #pull-tip .sp { display: inline-block; animation: rot .8s linear infinite; }
  #trend7d, #trend24h { position: relative; }
  .chart-tip {
    position: absolute; z-index: 5; display: none; pointer-events: none;
    background: var(--panel); border: 1px solid var(--border-hi);
    border-radius: 8px; padding: 4px 10px;
    font-family: var(--mono); font-size: 12px; font-weight: 550; color: var(--text);
    box-shadow: var(--shadow-pop); white-space: nowrap;
    transform: translate(-50%, -100%);
  }
  .trend-label { color: var(--dim); font-size: 9.5px; font-family: var(--mono); margin: 2px 0; }
  .rank-sw { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .rank-sw b { font-weight: 400; padding: 1px 8px; cursor: pointer; color: var(--dim); font-size: 10px; }
  .rank-sw b.on { background: var(--accent-soft); color: var(--accent); }
  .rank-row { margin-bottom: 7px; }
  .rank-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11px; margin-bottom: 2px; min-width: 0; }
  .rank-top .n { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .rank-top .n:hover { color: var(--accent); }
  .rank-top .v { color: var(--dim); font-family: var(--mono); font-size: 10px; white-space: nowrap; }
  .rank-row .bar { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .rank-row .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .tool-row .bar { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .tool-row .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .tool-row .cnt { text-align: right; color: var(--dim); }

  .todo-item { display: flex; gap: 7px; padding: 4px 1px; border-bottom: 1px dashed var(--border); font-size: 11.5px; align-items: flex-start; }
  .todo-item:last-child { border-bottom: none; }
  .todo-item { cursor: pointer; }
  .todo-item:hover { background: var(--hover); }
  .todo-item .flag { flex: none; font-size: 9px; border-radius: 4px; padding: 0 5px; font-family: var(--mono); }
  .todo-item .flag.over { background: var(--red-soft); color: var(--red); }
  .todo-item .ck { flex: none; width: 14px; height: 14px; margin-top: 1px; border: 1px solid var(--border-hi); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }
  .todo-item .ck.on { background: var(--accent); border-color: var(--accent); color: #ffffff; }
  .todo-item .ck.on::after { content: '✓'; font-size: 10px; font-weight: 700; }
  .todo-item.done .t { text-decoration: line-through; color: var(--dim); }
  .todo-item .flag.p { background: var(--done-soft); color: var(--accent2); }
  .todo-item.overdue .t { color: var(--red); }
  .todo-item .t { word-break: break-all; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  #v-refresh.spin svg { animation: rot .6s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .sysbar { flex: none; padding: 7px 16px; display: flex; align-items: center; gap: clamp(14px, 2.5vw, 34px); }
  .sysbar h3 { font-size: 10.5px; color: var(--dim); letter-spacing: .08em; flex: none; }
  #sysbar { flex: 1; min-width: 0; display: flex; align-items: center; gap: clamp(14px, 2.5vw, 34px); }
  .sys-item { display: flex; align-items: center; gap: 8px; min-width: 0; position: relative; }
  .sys-item .k { color: var(--dim); font-size: 10.5px; letter-spacing: .04em; flex: none; }
  .sys-item .v { color: var(--text); font-size: 11px; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sys-item .v-full { display: inline; }
  .sys-item .v-short { display: none; }
  /* 宽屏单行：进度条形态（名称 + 仪表条 + 完整数值） */
  .sys-item .gauge { width: clamp(50px, 8vw, 120px); height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .sys-item .gauge i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width .4s; }
  .sys-item .gauge i.hot { background: var(--red); }
  /* 窄形态：圆环（百分比/速率在环心） */
  .sys-item .ring { display: none; position: relative; }
  .sys-item .donut { width: 100%; height: 100%; transform: rotate(-90deg); }
  .sys-item .donut .bg { fill: none; stroke: var(--border); stroke-width: 3.6; }
  .sys-item .donut .fg { fill: none; stroke: var(--accent); stroke-width: 3.6; transition: stroke-dasharray .4s; }
  .sys-item .donut .fg.hot { stroke: var(--red); }
  .sys-item .donut .fg.butt { stroke-linecap: butt; }
  #g-net-down { stroke: #16a34a; }
  #g-net-up { stroke: var(--red); }
  @media (prefers-color-scheme: dark) { #g-net-down { stroke: #3fb950; } }
  .sys-item .ring-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; font-family: var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
  .sys-item.net .net-arrows { display: none; }  /* 仅圆环形态在环心显示 */
  .net-arrows { display: flex; flex-direction: column; line-height: 1.15; font-size: 12px; flex: none; }
  .sys-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  /* 专注模式：隐藏摘要卡/数据侧栏/系统资源，只留会话列表与会话面板 */
  body.zen .summary, body.zen .side, body.zen .sysbar { display: none !important; }
  /* Pad/手机：标题行右侧仅保留全屏按钮 */
  html.is-pad .todo-chip, html.is-pad #tiles-count { display: none !important; }
  html.is-pad .sys-item.net .net-arrows { display: none !important; }  /* pad 不展示网络箭头字形 */
  html.is-phone .sys-item.net .net-arrows { display: none !important; }
  html.is-phone .todo-chip, html.is-phone #tiles-count { display: none !important; }
  /* 手机：标题行一行放下 标题+工作空间+切换+终端+全屏（缩小下拉、收紧间距） */
  html.is-phone .ws-dd { margin-left: 6px; }
  html.is-phone .ws-select { min-width: 0; max-width: 104px; }
  html.is-phone #tiles-head .view-sw { margin-left: 6px; }
  html.is-phone .hdr-btn { margin-left: 2px; }
  html.is-phone #tiles-head .r { gap: 2px; margin-left: auto; }
  /* 手机：数据侧栏开关无用（侧栏已隐藏），一并隐藏 */
  html.is-phone #side-toggle { display: none !important; }
  .sys-item .v { color: var(--text); font-size: 11px; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sys-item .v small { color: var(--dim); font-size: 9.5px; }


  /* 平板/小屏仍保持一屏仪表盘布局：仅放宽卡片最小宽与侧栏宽度 */
  /* pad 竖屏窄幅：左右两栏平分，保证右侧面板标题不换行 */
  @media (max-width: 1180px) and (orientation: portrait) {
    .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  }
  /* pad：筛选标签、切换、计数同一行（标题在最左），横竖屏一致 */
  html.is-pad #tiles-head { flex-wrap: nowrap; }
  html.is-pad #st-tabs { order: 2; flex: 1 1 0; min-width: 0; padding: 0; margin-left: 12px; flex-wrap: nowrap; overflow-x: auto; }
  html.is-pad #st-tabs > b { flex: none; }
  html.is-pad #tiles-head .r { order: 4; margin-left: 12px; }
  /* pad（481-1180）：会话列表无折叠；右侧面板整面板折叠（留细条可恢复），其余面板高度自适应 */
  @media (max-width: 1180px) {
    .side .panel h3 { cursor: pointer; }
  }
  /* 所有面板统一：点击标题折叠为细条，其余面板高度自适应 */
  .side .panel h3 { cursor: pointer; }
  .side .panel.collapsed { flex: none !important; background: transparent; border: none; box-shadow: none; padding: 4px 12px; }
  .side .panel.collapsed h3 { margin-bottom: 0; }
  /* pad/手机横屏等窄幅：通用收紧 */
  @media (max-width: 1180px), (max-height: 600px) {
    .tiles { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .side .panel { padding: 6px 10px; }
    .tiles, .colbody, .panel-scroll { -webkit-overflow-scrolling: touch; }
    /* 筛选标签窄幅下收紧，保证一行放下 */
    #st-tabs { gap: 4px; }
    #st-tabs > b { padding: 2px 6px; font-size: 10px; height: 21px; white-space: nowrap; }
    #st-tabs > b i { margin-left: 2px; }
  }
  #tiles-head { display: flex; flex-wrap: wrap; justify-content: flex-start; align-items: center; padding: 8px 12px; cursor: pointer; user-select: none; }
  #tiles-head .t { color: var(--dim); font-size: 11.5px; font-weight: 650; letter-spacing: .04em; }
  #tiles-head .r { display: inline-flex; align-items: center; gap: 8px; }
  #tiles-head .n { color: var(--dim); font-size: 11px; font-family: var(--mono); }
  body.tiles-collapsed #tiles { display: none; }
  body.tiles-collapsed #tiles-head { background: transparent; border: none; box-shadow: none; padding: 4px 12px; }
  .side .panel.collapsed .panel-scroll, .side .panel.collapsed .trend-body { display: none; }
  @media (min-width: 1181px) {
    .side .panel h3 { cursor: default; }
    #tiles-head .t, #tiles-head .r { display: none; }
    #st-tabs { order: 0; flex: 1 1 auto; padding: 0; flex-wrap: nowrap; }
  }

  /* 手机竖屏：单页模式——解除高度限制，卡片独立无外框，全部内容顺排可一直滚 */
  @media (max-width: 480px) and (orientation: portrait) {
    /* 一屏模式：外框固定一屏，卡片列表内部滚动（与桌面一致） */
    /* 顶栏：日期时间与标题同行，不换行 */
    header { flex-wrap: nowrap; gap: 5px; align-items: center; }
    .hdr-btn { width: 22px; height: 22px; margin-left: 4px; }

  // 旧实例清理钩子：热更新时关闭旧的推送/定时器（防止新旧实例冲突）

    async function hotUpdate() {
      const res = await fetch(location.pathname + '?_v=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const newStyle = doc.querySelector('style');
      if (newStyle) document.querySelector('style').outerHTML = newStyle.outerHTML;
      const newMeta = doc.querySelector('meta[name="page-ver"]');

      try { es.close(); stopPolling(); } catch {}
