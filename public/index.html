      Array.from(doc.body.childNodes).forEach((n) => cur.appendChild(document.importNode(n, true)));
      scripts.forEach((code) => { const s = document.createElement('script'); s.textContent = code; cur.appendChild(s); });
    }

    function checkPageVer(d) {
      if (!d.pageVer || d.pageVer === PAGE_VER || pageUpdating) return false;
      pageUpdating = true;
      hotUpdate().then(() => {
        PAGE_VER = d.pageVer;                                      // 同步版本基线，后续对比正确
        const meta = document.querySelector('meta[name="page-ver"]');
        if (meta) meta.content = PAGE_VER;
        pageUpdating = false;                                      // 允许下一次热更新
      }).catch(() => { pageUpdating = false; location.reload(); });
      return true;
    }
    const BADGE = { confirm: '待确认', thinking: '思考中', executing: '执行中', running: '运行中', idle: '空闲', stale: '已僵死' };
    // 标记会话已查看：进入会话前调用，卡片立即乐观更新为「空闲」（不等下一帧 SSE）
    function markSeen(sid) {
      try {
        const s = DATA && DATA.sessions.find((v) => v.sessionId === sid);
        if (s) s.doneUnseen = false;
        const card = document.querySelector(`.card[data-sid="${CSS.escape(sid)}"]`);
        if (card) {
          card.classList.remove('completed');
          const b = card.querySelector('.badge');
          if (b) b.innerHTML = '<i></i>空闲';
        }
      } catch (e) { /* 乐观更新失败不影响跳转 */ }
      try {
        fetch('kd/seen', { method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-KD-Token': fbToken },
          body: JSON.stringify({ sessionId: sid }) }).catch(() => {});
      } catch (e) { /* 忽略：打点失败不影响跳转 */ }
    }

    function fmtTokens(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
      return String(n);
    }
    function fmtAgo(t) {
      const s = Math.max(0, (Date.now() - t) / 1000);
      if (s < 60) return Math.floor(s) + 's 前';
      if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
      if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
      return Math.floor(s / 86400) + ' 天前';
    }
    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    function basename(p) { return p ? p.split('/').filter(Boolean).pop() : ''; }
    function totalTokens(u) { return u.inputOther + u.output + u.cacheRead + u.cacheCreation; }

    function sessionCard(s) {
      const title = esc(s.title.length > 80 ? s.title.slice(0, 80) + '…' : s.title);
      const st = s.status === 'stale' ? 'stale' : s.status;
      const ph = s.phase || st;
      const doneUnseen = s.status === 'idle' && s.doneUnseen;
      let h = `<div class="card ${st}${doneUnseen ? ' completed' : ''}" data-sid="${esc(s.sessionId)}">`;
      h += `<span class="badge"><i></i>${doneUnseen ? '任务完成' : (BADGE[ph] || ph)}</span>`;
      h += `<div class="card-body">`;
      h += `<div class="title">${title}</div>`;
      h += `<div class="meta">▸ ${esc(basename(s.cwd))} · <span class="last-ago">${fmtAgo(s.lastActive)}</span></div>`;

      const isWait = (s.phase === 'confirm' || s.status === 'waiting' || s.status === 'stale');
      {
        const chips = [];
        if (s.model) chips.push(`<span class="chip model" title="当前模型 ${esc(s.model)}">◈ ${esc(s.model)}</span>`);
        if (s.turnCountToday) chips.push(`<span class="chip">${s.turnCountToday} 轮</span>`);
        if (s.filesChanged) chips.push(`<span class="chip">${s.filesChanged} 文件</span>`);
        if (chips.length) h += `<div class="chips">${chips.join('')}</div>`;
      }
      for (const p of s.pending) {
        const wait = Math.floor((Date.now() - p.requestedAt) / 1000);
        const waitTxt = wait >= 60 ? Math.floor(wait / 60) + 'm' : wait + 's';
        const toolTxt = (!p.toolName || p.toolName === '?') ? '待确认' : p.toolName;
        const actFull = p.action || '';
        const act = esc(actFull);
        h += `<div class="approval" title="${esc(actFull || toolTxt)}"><div class="approval-head"><svg class="paic" viewBox="0 0 24 24" width="11" height="11"><path fill="currentColor" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><span class="tool">${esc(toolTxt)}</span><span class="wt">等待确认 · ${waitTxt}</span></div><div class="action">${act}</div></div>`;
      }
      if (!isWait) {
        const ctxMax = s.contextMax || CTX_MAX;
        const pct = s.contextTokens ? Math.min(100, s.contextTokens / ctxMax * 100) : 0;
        const tot = totalTokens(s.usageTotal || {inputOther:0, output:0, cacheRead:0, cacheCreation:0});
        const todayTok = totalTokens(s.usageToday);
        const maxTotal = Math.max(1, ...(DATA ? DATA.sessions : []).map((x) => totalTokens(x.usageTotal || {inputOther:0, output:0, cacheRead:0, cacheCreation:0})));
        const pctToday = Math.min(100, Math.round(todayTok / tot * 100));
        const pctTotal = Math.min(100, Math.round(tot / maxTotal * 100));
        h += `<div class="ctxwrap">`;
        if (s.lastPrompt) {
          const task = s.lastPrompt.length > 60 ? s.lastPrompt.slice(0, 60) + '…' : s.lastPrompt;
          h += `<div class="task-line" title="${esc(s.lastPrompt)}"><b>任务:</b> ${esc(task)}</div>`;
        }
        h += `<div class="trio">`;
        h += `<div class="trio-col"><div class="k">上下文</div><div class="v">${s.contextTokens ? fmtTokens(s.contextTokens) + ' / ' + fmtTokens(ctxMax) : '—'}</div><div class="ctxbar" title="上下文 ${fmtTokens(s.contextTokens)} / ${fmtTokens(ctxMax)} tokens"><i class="${pct > 80 ? 'hot' : ''}" style="width:${pct}%"></i></div></div>`;
        h += `<div class="trio-col"><div class="k">今日</div><div class="v ttoday">${fmtTokens(todayTok)} tok</div><div class="ctxbar" title="今日占累计 ${pctToday}%"><i style="width:${pctToday}%"></i></div></div>`;
        h += `<div class="trio-col"><div class="k">累计</div><div class="v ttotal">${fmtTokens(tot)} tok</div><div class="ctxbar" title="累计（相对最大会话 ${pctTotal}%）"><i style="width:${pctTotal}%"></i></div></div>`;
        h += `</div></div>`;
      }
      return h + `</div></div>`;
    }

    function chartSvg(items, kind, gid) {
      const H = 40, base = H - 2, n = items.length;
      const vals = items.map((it) => it.tokens);
      const max = Math.max(1, ...vals);
      let body = '';
      if (kind === 'bar') {
        const bw = 100 / n;
        items.forEach((it, i) => {
          const h = Math.max(it.tokens > 0 ? 2.5 : 0.5, it.tokens / max * (base - 2));
          body += `<rect x="${(i * bw + bw * 0.15).toFixed(2)}" y="${(base - h).toFixed(2)}" width="${(bw * 0.7).toFixed(2)}" height="${h.toFixed(2)}" fill="url(#${gid})"/>`;
        });
      } else {
        const pts = items.map((it, i) => `${(3 + i * 94 / (n - 1)).toFixed(2)},${(base - it.tokens / max * (base - 6)).toFixed(2)}`);
        const line = 'M' + pts.join(' L');
        body = `<path class="area" d="${line} L97,${base} L3,${base} Z" fill="url(#${gid})"/>`
          + `<path class="line" d="${line}" fill="none" stroke="var(--accent2)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
      }
      return `<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" class="trend-svg" data-kind="${kind}">
        <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${kind === 'bar' ? 'var(--accent)' : 'var(--accent2)'}" stop-opacity="${kind === 'bar' ? '.8' : '.4'}"/>
          <stop offset="1" stop-color="${kind === 'bar' ? 'var(--accent)' : 'var(--accent2)'}" stop-opacity="${kind === 'bar' ? '.2' : '0'}"/>
        </linearGradient></defs>
        <line class="baseline" x1="0" y1="${base}" x2="100" y2="${base}" stroke="var(--border)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        ${body}
        <line class="guide" y1="0" y2="${H}" stroke="var(--border-hi)" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>
      </svg>`;
    }

    function updateChartSvg(elId, items) {
      const el = document.getElementById(elId);
      const svg = el.querySelector('svg');
      const kind = svg.dataset.kind;
      const H = 40, base = H - 2, n = items.length;
      const vals = items.map((it) => it.tokens);
      const max = Math.max(1, ...vals);
      if (kind === 'bar') {
        const bw = 100 / n;
        svg.querySelectorAll('rect').forEach((r, i) => {
          const h = Math.max(vals[i] > 0 ? 2.5 : 0.5, vals[i] / max * (base - 2));
          r.setAttribute('y', (base - h).toFixed(2));
          r.setAttribute('height', h.toFixed(2));
        });
      } else {
        const pts = items.map((it, i) => `${(3 + i * 94 / (n - 1)).toFixed(2)},${(base - vals[i] / max * (base - 6)).toFixed(2)}`);
        const line = 'M' + pts.join(' L');
        svg.querySelector('path.area').setAttribute('d', line + ` L97,${base} L3,${base} Z`);
        svg.querySelector('path.line').setAttribute('d', line);
      }
    }

    const trendState = {};

    function mountTrend(elId, items, kind, labelFn, gid) {
      const el = document.getElementById(elId);
      const axis = kind === 'area'
        ? '<div class="axis"><span style="left:0">0时</span><span style="left:26%">6时</span><span style="left:52%">12时</span><span style="left:78%">18时</span><span style="left:100%;transform:translateX(-100%)">23时</span></div>'
        : '';
      el.innerHTML = chartSvg(items, kind, gid) + axis + '<div class="chart-tip"></div>';
      const svg = el.querySelector('svg');
      const guide = svg.querySelector('.guide');
      const tip = el.querySelector('.chart-tip');
      const st = { items, labelFn, kind };
      trendState[elId] = st;
      svg.addEventListener('mousemove', (e) => {
        const rect = svg.getBoundingClientRect();
        const vx = (e.clientX - rect.left) / rect.width * 100;
        const n = st.items.length;
        let idx = Math.round((vx - 3) / (94 / (n - 1)));
        idx = Math.max(0, Math.min(n - 1, idx));
        const it = st.items[idx];
        const v = it.tokens;
        const x = 3 + idx * 94 / (n - 1);
        const max = Math.max(1, ...st.items.map((it2) => it2.tokens));
        guide.setAttribute('x1', x);
        guide.setAttribute('x2', x);
        guide.style.display = 'block';
        tip.style.display = 'block';
        tip.style.left = Math.min(Math.max(x, 15), 85) + '%';
        // 气泡锚定数据点：点高时气泡放下方，点低时放上方，始终在图表容器内不被裁切
        const base = 38;
        const yv = st.kind === 'bar' ? base - v / max * (base - 2) : base - v / max * (base - 6);
        const yp = yv / 40 * 100;
        if (yp > 50) {
          tip.style.top = Math.max(yp - 52, 0) + '%';
          tip.style.transform = 'translate(-50%, -100%)';
        } else {
          tip.style.top = (yp + 2) + '%';
          tip.style.transform = 'translate(-50%, 0)';
        }
        tip.textContent = `${st.labelFn(it)}：${fmtTokens(v)} tok`;
        if (kind === 'bar') {
          svg.querySelectorAll('rect').forEach((r, ri) => { r.style.opacity = ri === idx ? 1 : .55; });
        }
      });
      svg.addEventListener('mouseleave', () => {
        tip.style.display = 'none';
        guide.style.display = 'none';
        if (kind === 'bar') svg.querySelectorAll('rect').forEach((r) => { r.style.opacity = 1; });
      });
    }

    function updateTrend(elId, items) {
      const st = trendState[elId];
      if (!st) return;
      st.items = items;
      updateChartSvg(elId, items);
    }

    let stFilter = localStorage.getItem('kd_stfilter') || 'all';
    let wsFilter = localStorage.getItem('kd_wsfilter') || '';

    // 状态筛选：待确认含僵死（超时）；已完成 = 完成且未查看；另有工作空间筛选
    // 展示所有工作空间内所有未完成、未归档的会话（后端已过滤已归档）
    function matchFilter(s) {
      if (wsFilter && s.workspace !== wsFilter) return false;
      if (stFilter === 'running') return s.status === 'running';
      if (stFilter === 'waiting') return s.status === 'waiting' || s.status === 'stale';
      if (stFilter === 'done') return s.status === 'idle' && s.doneUnseen;
      if (stFilter === 'idle') return s.status === 'idle' && !s.doneUnseen;
      return true;
    }

    function updateStTabs(d) {
      const c = { all: 0, running: 0, waiting: 0, done: 0, idle: 0 };
      for (const s of d.sessions) {
        c.all++;
        if (s.status === 'running') c.running++;
        else if (s.status === 'waiting' || s.status === 'stale') c.waiting++;
        else if (s.status === 'idle') { if (s.doneUnseen) c.done++; else c.idle++; }
      }
      document.querySelectorAll('#st-tabs > b').forEach((b) => {
        const i = b.querySelector('i');
        if (i) i.textContent = c[b.dataset.f] || '';
        b.classList.toggle('on', b.dataset.f === stFilter);
      });
    }

    function setFilter(f) {
      stFilter = f;
      localStorage.setItem('kd_stfilter', f);
      document.querySelectorAll('#st-tabs > b').forEach((x) => x.classList.toggle('on', x.dataset.f === f));
      applyFilterNow();
    }
    // 筛选切换：强制整列表立即重建。卡片只按「构建时的筛选组合」生成，
    // 就地显隐补不出新组合的卡片（切换后新命中的会话不在 DOM → 列表空白/不更新），
    // 必须整体重建；用户主动操作需即时生效，绕过滚动暂缓。
    function applyFilterNow() {
      if (!DATA) return;
      tilesScrollAt = 0;
      if (tilesBuildTimer) { clearTimeout(tilesBuildTimer); tilesBuildTimer = null; }
      buildTiles(DATA);
    }
    function updateWsSelect(d) {
      const menu = document.getElementById('ws-menu');
      const seen = new Set();
      const list = [];
      for (const s of d.sessions) {
        if (s.workspace && !seen.has(s.workspace)) {
          seen.add(s.workspace);
          list.push({ key: s.workspace, name: basename(s.cwd) || s.workspace });
        }
      }
      if (wsFilter && !seen.has(wsFilter)) { wsFilter = ''; localStorage.setItem('kd_wsfilter', ''); }
      // 仅当工作空间清单变化时才重建菜单，避免交互中 innerHTML 替换吞掉用户点击
      const sig = list.map((w) => w.key).join('|');
      if (menu.dataset.sig !== sig) {
        menu.dataset.sig = sig;
        menu.innerHTML = '<div class="ws-opt" data-ws=""><span>全部工作空间</span><span class="ck"></span></div>' +
          list.map((w) => `<div class="ws-opt" data-ws="${esc(w.key)}"><span>${esc(w.name)}</span><span class="ck"></span></div>`).join('');
      }
      // 选中态与标签每次同步
      menu.querySelectorAll('.ws-opt').forEach((o) => {
        const on = o.dataset.ws === wsFilter;
        o.classList.toggle('on', on);
        const ck = o.querySelector('.ck');
        if (ck) ck.textContent = on ? '✓' : '';
      });
      const cur = list.find((w) => w.key === wsFilter);
      document.getElementById('ws-select-label').textContent = cur ? cur.name : '全部工作空间';
    }

    function setWsFilter(v) {
      wsFilter = v || '';
      localStorage.setItem('kd_wsfilter', wsFilter);
      applyFilterNow();
      syncWsUi();
    }
    function syncWsUi() {
      const menu = document.getElementById('ws-menu');
      if (menu) menu.querySelectorAll('.ws-opt').forEach((o) => {
        const on = o.dataset.ws === wsFilter;
        o.classList.toggle('on', on);
        o.querySelector('.ck').textContent = on ? '✓' : '';
      });
      const label = document.getElementById('ws-select-label');
      if (label) {
        const cur = ((DATA && DATA.sessions) || []).find((s) => s.workspace === wsFilter);
        label.textContent = wsFilter ? (cur ? (basename(cur.cwd) || cur.workspace) : wsFilter) : '全部工作空间';
      }
    }

    // 指标卡点击：Token/轮次开浮层，运行中/待确认切换筛选
    function openPop(title, html) {
      const ov = document.getElementById('pop-overlay');
      ov.querySelector('.pop').innerHTML = '<span class="close" id="pop-close">✕</span><h3>' + title + '</h3>' + html;
      ov.classList.add('open');
    }
    function closePop() {
      document.getElementById('pop-overlay').classList.remove('open');
    }
    function rankRows(list, fmtVal) {
      const max = list.length ? list[0].val : 1;
      return list.map((s) =>
        `<div class="srow" data-sid="${esc(s.sid)}"><span class="nm" title="${esc(s.name)}">${esc(s.name)}</span><span class="bar"><i style="width:${(s.val / max * 100).toFixed(1)}%"></i></span><span class="v">${fmtVal(s.val)}</span></div>`
      ).join('');
    }
    function openTokPop() {
      if (!DATA) return;
      const days = DATA.trend7d || [];
      const max = Math.max(1, ...days.map((d) => d.tokens));
      const bars = days.map((d) => `<i style="height:${Math.max(2, d.tokens / max * 100).toFixed(1)}%" title="${d.date} · ${fmtTokens(d.tokens)} tok"></i>`).join('');
      const list = DATA.sessions.map((s) => ({ name: s.title, sid: s.sessionId, val: totalTokens(s.usageToday) }))
        .filter((s) => s.val > 0).sort((a, b) => b.val - a.val);
      openPop('今日 TOKEN · 趋势与会话消耗',
        `<h4>近 7 日趋势</h4><div class="bars">${bars}</div><h4>今日各会话消耗（点击进入会话）</h4>`
        + (list.length ? rankRows(list, (v) => fmtTokens(v)) : '<div class="empty2">今日暂无消耗</div>'));
    }
    function openTurnPop() {
      if (!DATA) return;
      const hours = DATA.turnHours || [];
      const max = Math.max(1, ...hours);
      const bars = hours.map((c, h) => `<i style="height:${Math.max(2, c / max * 100).toFixed(1)}%" title="${h}:00 · ${c} 轮"></i>`).join('');
      const list = DATA.sessions.map((s) => ({ name: s.title, sid: s.sessionId, val: s.turnCountToday }))
        .filter((s) => s.val > 0).sort((a, b) => b.val - a.val);
      openPop('今日轮次 · 分布与会话排行',
        `<h4>按小时分布（今日）</h4><div class="bars">${bars}</div><h4>今日各会话轮次（点击进入会话）</h4>`
        + (list.length ? rankRows(list, (v) => v + ' 轮') : '<div class="empty2">今日暂无轮次</div>'));
    }
    document.addEventListener('click', (e) => {
      const ov = document.getElementById('pop-overlay');
      if (ov.classList.contains('open')) {
        const row = e.target.closest('.srow[data-sid]');
        if (row && DATA) {
          const s = DATA.sessions.find((x) => x.sessionId === row.dataset.sid);
          closePop();
          if (s) enterSession(s);
          return;
        }
        if (e.target.id === 'pop-close' || e.target.id === 'pop-overlay') {
          closePop();
          return;
        }
      }
      if (e.target.closest('#todo-add')) { openTodoAdd(); return; }
      const card = e.target.closest('.sum-card[data-card]');
      if (!card) return;
      const k = card.dataset.card;
      if (k === 'token') openTokPop();
      else if (k === 'turns') openTurnPop();
      else if (k === 'todo') openTodoPop();
      else if (k === 'running') {
        const seq = ['running', 'waiting', 'all'];
        const i = seq.indexOf(stFilter);
        setFilter(i >= 0 ? seq[(i + 1) % 3] : 'running');
      }
      else setFilter(stFilter === k ? 'all' : k);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePop();
    });

    document.addEventListener('click', (e) => {
      const b = e.target.closest('#st-tabs > b');
      if (!b || b.dataset.f === stFilter) return;
      setFilter(b.dataset.f);
    });
    (() => {
      const dd = document.querySelector('.ws-dd');
      dd.querySelector('.ws-select').addEventListener('click', (e) => {
        e.stopPropagation();
        dd.classList.toggle('open');
      });
      dd.querySelector('.ws-menu').addEventListener('click', (e) => {
        const opt = e.target.closest('.ws-opt');
        if (!opt) return;
        dd.classList.remove('open');
        setWsFilter(opt.dataset.ws);
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.ws-dd')) dd.classList.remove('open');
      });
    })();

    // 滚动中暂缓整列表重建（SSE 高频触发时 innerHTML 替换会造成滚动顿挫），静止后再补
    let tilesScrollAt = 0;
    let tilesBuildTimer = null;
    let pendingRender = null;
    let renderTimer = null;
    function buildTiles(d) {
      const tilesEl = document.getElementById('tiles');
      if (Date.now() - tilesScrollAt < 500) {
        if (!tilesBuildTimer) {
          tilesBuildTimer = setTimeout(() => { tilesBuildTimer = null; buildTiles(d); }, 520);
        }
        return;
      }
      const visible = d.sessions.filter(matchFilter);
      updateStTabs(d);
      updateWsSelect(d);
      document.getElementById('tiles-count').textContent = visible.length === d.sessions.length
        ? d.sessions.length + ' 会话'
        : visible.length + '/' + d.sessions.length + ' 会话';
      const savedScroll = tilesEl.scrollTop;
      if (!visible.length) {
        tilesEl.innerHTML = '<div class="empty">该状态下暂无会话</div>';
        return;
      }
      // 平铺：按最后活跃倒序；窄屏时 运行中/待确认 置顶
      let list = visible;
      if (matchMedia('(max-width: 480px)').matches) {
        const pri = (s) => (s.status === 'running' || s.status === 'waiting' || s.status === 'stale') ? 0 : 1;
        list = [...visible].sort((a, b) => (pri(a) - pri(b)) || (b.lastActive - a.lastActive));
      } else {
        list = [...visible].sort((a, b) => b.lastActive - a.lastActive);
      }
      tilesEl.innerHTML = list.map(sessionCard).join('');
      tilesEl.scrollTop = savedScroll;
      if (typeof spMarkSel === 'function') spMarkSel();
    }


    let lastRenderKey = '';
    let lastTrendKey = '';
    let lastSummaryKey = '';
    let lastUpd = '';
    const collapsedGroups = new Set();
    let DATA = null;

    function structKey(d) {
      return d.sessions.map((s) => [s.sessionId, s.status, s.doneUnseen ? 1 : 0, s.pending.length, s.turnCountToday,
        s.filesChanged, s.model || '', s.title].join(':')).join('|')
        + '#' + (d.sys ? d.sys.updatedAt : 0) + '#' + (d.todos ? d.todos.updatedAt : 0);
    }

    function lightUpdate(d) {
      // 结构未变时只原地刷新易变数字，避免整块 DOM 重建造成的卡顿
      const tilesEl = document.getElementById('tiles');
      for (const s of d.sessions) {
        const card = tilesEl.querySelector(`.card[data-sid="${s.sessionId}"]`);
        if (!card) continue;
        // 数值没变就不写 DOM：避免每秒一帧的 SSE 触发全列表重排版
        const todayEl = card.querySelector('.ttoday');
        if (todayEl) {
          const v = fmtTokens(totalTokens(s.usageToday)) + ' tok';
          if (todayEl.textContent !== v) todayEl.textContent = v;
        }
        const totalEl = card.querySelector('.ttotal');
        if (totalEl) {
          const v = fmtTokens(totalTokens(s.usageTotal || {inputOther:0, output:0, cacheRead:0, cacheCreation:0})) + ' tok';
          if (totalEl.textContent !== v) totalEl.textContent = v;
        }
        const bars = card.querySelectorAll('.ctxbar i');
        if (bars.length >= 3) {
          const tot = totalTokens(s.usageTotal || {inputOther:0, output:0, cacheRead:0, cacheCreation:0});
          const todayTok = totalTokens(s.usageToday);
          const w = (tot ? Math.min(100, Math.round(todayTok / tot * 100)) : 0) + '%';
          if (bars[1].dataset.w !== w) { bars[1].style.width = w; bars[1].dataset.w = w; }
        }
        const agoEl = card.querySelector('.last-ago');
        if (agoEl) {
          const v = fmtAgo(s.lastActive);
          if (agoEl.textContent !== v) agoEl.textContent = v;
        }
        if (s.contextTokens) {
          const ctxMax = s.contextMax || CTX_MAX;
          const pct = Math.min(100, s.contextTokens / ctxMax * 100);
          const numEl = card.querySelector('.ctxline b');
          if (numEl) {
            const v = fmtTokens(s.contextTokens) + ' / ' + fmtTokens(ctxMax) + ' · ' + Math.round(pct) + '%';
            if (numEl.textContent !== v) numEl.textContent = v;
          }
          const barI = card.querySelector('.ctxbar i');
          if (barI) {
            const w = pct + '%';
            if (barI.dataset.w !== w) { barI.style.width = w; barI.dataset.w = w; }
            barI.classList.toggle('hot', pct > 80);
          }
        }
      }
    }

    let lastTodosKey = '';
    // 待办管理浮层：窄屏/侧栏收起时，经「今日待办」指标卡进入（点条目勾选完成）
    function openTodoPop() {
      if (!DATA) return;
      const td = DATA.todos || {};
      const items = (td.ok && td.items) ? td.items : [];
      const rows = items.length
        ? items.map((x, i) => `<div class="todo-item${x.done ? ' done' : ''}${x.overdue ? ' overdue' : ''}" data-i="${i}"><span class="ck${x.done ? ' on' : ''}"></span>${x.overdue ? `<span class="flag over">${esc(x.flag || '逾期')}</span>` : ''}<span class="t">${esc(x.title)}</span></div>`).join('')
        : '<div class="empty">今天没有到期待办 ✓</div>';
      openPop('今日待办',
        `<div id="pop-todo-list">${td.ok ? rows : `<div class="empty">${esc(td.hint || '待办加载中…')}</div>`}</div>`
        + `<button class="todo-submit" id="pop-todo-add">添加待办</button>`);
      document.getElementById('pop-todo-list').addEventListener('click', async (e) => {
        const it = e.target.closest('.todo-item');
        if (!it) return;
        const item = items[+it.dataset.i];
        if (!item) return;
        try {
          await fetch('kd/todo/done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: item.title, done: !item.done }) });
          item.done = !item.done;
          it.classList.toggle('done', item.done);
          const ck = it.querySelector('.ck');
          if (ck) ck.classList.toggle('on', item.done);
          refresh();
        } catch (err) {}
      });
      document.getElementById('pop-todo-add').addEventListener('click', openTodoAdd);
    }
    function renderTodos(d) {      const td = d.todos || {};
      const tk = JSON.stringify(td);
      if (tk === lastTodosKey) return;
      lastTodosKey = tk;
      const chipN = document.getElementById('todo-chip-n');
      if (chipN) chipN.textContent = td.ok ? td.items.filter(x => !x.done).length : 0;
      document.getElementById('todo-note').textContent = td.ok ? `${td.items.length} 项` : '';
      document.getElementById('todo-list').innerHTML = td.ok
        ? (td.items.length
            ? td.items.map((x) => `<div class="todo-item${x.done ? ' done' : ''}${x.overdue ? ' overdue' : ''}" data-title="${esc(x.title)}"><span class="ck${x.done ? ' on' : ''}"></span>${x.overdue ? `<span class="flag over">${esc(x.flag || '逾期')}</span>` : ''}<span class="t">${esc(x.title)}</span></div>`).join('')
            : '<div class="empty">今天没有到期待办 ✓</div>')
        : `<div class="empty">${esc(td.hint || '待办加载中…')}</div>`;
    }

    function openTodoAdd() {
      openPop('添加今日待办',
        '<input id="todo-input" class="todo-input" maxlength="100" placeholder="输入待办内容，回车或点击添加…" autocomplete="off">' +
        '<button id="todo-submit" class="todo-submit">添加</button>' +
        '<div class="todo-err" id="todo-err"></div>');
      const input = document.getElementById('todo-input');
      input.focus();
      const submit = async () => {
        const v = input.value.trim();
        const errEl = document.getElementById('todo-err');
        if (!v) { errEl.textContent = '请输入待办内容'; return; }
        const btn = document.getElementById('todo-submit');
        btn.disabled = true;
        try {
          const resp = await (await fetch('kd/todo/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: v }) })).json();
          if (resp.ok) {
            if (DATA && DATA.todos && DATA.todos.ok) {
              DATA.todos.items.unshift({ id: v.slice(0, 40), title: v, priority: 0, overdue: false, flag: '', done: false });
              renderTodos(DATA);
            }
            closePop();
          } else {
            btn.disabled = false;
            errEl.textContent = resp.reason === 'dup' ? '今日已存在相同内容的待办' : '添加失败，请重试';
          }
        } catch (err) {
          btn.disabled = false;
          errEl.textContent = '网络异常，请重试';
        }
      };
      document.getElementById('todo-submit').addEventListener('click', submit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    }

    function render(d) {
      if (checkPageVer(d)) return;
      DATA = d;
      updateFbWorkspaces(d);
      // 滚动期间暂缓全部 DOM 写入（SSE 每秒一帧），静止后一次性补渲染
      if (lastRenderKey && Date.now() - tilesScrollAt < 400) {
        pendingRender = d;
        if (!renderTimer) {
          renderTimer = setTimeout(() => { renderTimer = null; const p = pendingRender; pendingRender = null; if (p) render(p); }, 420);
        }
        return;
      }
      const dt = new Date(d.now);
      const upd = dt.toLocaleDateString('zh-CN') + ' ' + dt.toLocaleTimeString('zh-CN', { hour12: false }) + '<span class="push-tag"> · ' + (pollTimer ? '3s 轮询' : '实时推送') + '</span>';
      if (upd !== lastUpd) { lastUpd = upd; document.getElementById('updated').innerHTML = upd; }
      const skey = structKey(d);
      const structureChanged = skey !== lastRenderKey;
      lastRenderKey = skey;
      if (!structureChanged) { lightUpdate(d); }

      const tiles = document.getElementById('tiles');
      const t = d.totals;
      const grand = totalTokens(t);
      // 运行中/待确认卡片的副行信息
      const runS = d.sessions.filter((s) => s.status === 'running');
      const runTok = runS.reduce((a, s) => a + totalTokens(s.usageToday), 0);
      const waitS = d.sessions.filter((s) => s.status === 'waiting' || s.status === 'stale');
      const todoItems = (d.todos && d.todos.ok && d.todos.items) ? d.todos.items : [];
      const todoUndone = todoItems.filter(x => !x.done).length;
      const todoTotal = todoItems.length;
      let maxWaitMs = 0;
      for (const s of waitS) for (const p of s.pending) maxWaitMs = Math.max(maxWaitMs, Date.now() - p.requestedAt);
      document.getElementById('summary').dataset.k = [fmtTokens(grand), fmtTokens(runTok), d.counts.running, d.counts.waiting, fmtDur(maxWaitMs), d.turnStats.count, d.turnStats.avgMs].join('|');
      if (document.getElementById('summary').dataset.k !== lastSummaryKey) {
        lastSummaryKey = document.getElementById('summary').dataset.k;
        document.getElementById('summary').innerHTML = `
        <div class="sum-card panel" data-card="token" title="点击查看趋势与会话消耗"><div class="k">今日 TOKEN</div><div class="v">${fmtTokens(grand)}</div><div class="sub">出 ${fmtTokens(t.output)} · 缓存 ${fmtTokens(t.cacheRead)} · 入 ${fmtTokens(t.inputOther)}</div></div>
        <div class="sum-card panel" data-card="running" title="点击切换筛选：进行中 → 待确认 → 全部"><div class="k">进行中 / 待确认</div><div class="v"><span style="color:var(--green)">${d.counts.running}</span><span style="color:var(--faint)"> / </span><span style="color:var(--yellow)">${d.counts.waiting}</span></div><div class="sub">合计 ${fmtTokens(runTok)} tok 今日${maxWaitMs ? ' · 最长等待 ' + fmtDur(maxWaitMs) : ''}</div></div>
        <div class="sum-card panel todo-card" data-card="todo" title="点击管理今日待办"><div class="k">今日待办</div><div class="v">${todoUndone}</div><div class="sub">未完成 / 共 ${todoTotal} 项 · 点击管理</div></div>
        <div class="sum-card panel" data-card="turns" title="点击查看轮次分布与会话排行"><div class="k">今日轮次</div><div class="v">${d.turnStats.count}</div><div class="sub">均 ${d.turnStats.avgMs ? (d.turnStats.avgMs / 1000).toFixed(1) + 's' : '—'}</div></div>`;
      }

      document.getElementById('trend-note').textContent = '7 天 / 今日';
      const tkey = JSON.stringify([d.trend7d, d.trend24h]);
      if (tkey !== lastTrendKey) {
        lastTrendKey = tkey;
        if (trendState['trend7d']) {
          updateTrend('trend7d', d.trend7d);
          updateTrend('trend24h', d.trend24h);
        } else {
          mountTrend('trend7d', d.trend7d, 'bar', (x) => { const p = x.date.split('-'); return parseInt(p[1]) + '月' + parseInt(p[2]) + '日'; }, 'bg7');
          mountTrend('trend24h', d.trend24h, 'area', (x) => x.hour + ':00', 'ag24');
        }
      }

      const tilesEl = document.getElementById('tiles');
      if (structureChanged) {
        buildTiles(d);
        lightUpdate(d);
      }

      renderRank(d);

      renderTodos(d);

      // sysbar 增量更新：只改数字文本与进度条宽度，不重建 DOM
      const sys = d.sys || {};
      const sysEl = document.getElementById('sysbar');
      if (!sys.updatedAt) return;
      if (!sysEl.dataset.built) {
        sysEl.innerHTML = `
          <div class="sys-item"><span class="k">CPU</span><div class="gauge"><i id="gb-cpu"></i></div><div class="ring"><svg class="donut" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.9"/><circle class="fg" id="g-cpu" cx="18" cy="18" r="15.9"/></svg><span class="ring-pct" id="p-cpu">--</span></div><span class="v" id="v-cpu">--</span></div>
          <div class="sys-item"><span class="k">内存</span><div class="gauge"><i id="gb-mem"></i></div><div class="ring"><svg class="donut" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.9"/><circle class="fg" id="g-mem" cx="18" cy="18" r="15.9"/></svg><span class="ring-pct" id="p-mem">--</span></div><span class="v" id="v-mem">--</span></div>
          <div class="sys-item"><span class="k">存储</span><div class="gauge"><i id="gb-disk"></i></div><div class="ring"><svg class="donut" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.9"/><circle class="fg" id="g-disk" cx="18" cy="18" r="15.9"/></svg><span class="ring-pct" id="p-disk">--</span></div><span class="v" id="v-disk">--</span></div>
          <div class="sys-item net"><span class="k">网络</span><span class="net-arrows"><span class="net-down">↓</span><span class="net-up">↑</span></span><div class="ring"><svg class="donut" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.9"/><circle class="fg butt" id="g-net-down" cx="18" cy="18" r="15.9"/><circle class="fg butt" id="g-net-up" cx="18" cy="18" r="15.9"/></svg></div><span class="v" id="v-net">--</span></div>`;
        sysEl.dataset.built = '1';
      }
      const setG = (g, v, vEl, text, hot, short) => {
        const fg = document.getElementById(g);
        if (!fg) return;
        fg.style.strokeDasharray = `${Math.max(0, Math.min(100, v))} 100`;   // 圆环图表
        fg.classList.toggle('hot', !!hot);
        const bar = document.getElementById('gb-' + g.slice(2));             // 进度条形态（宽屏单行）
        if (bar) { bar.style.width = Math.max(0, Math.min(100, v)) + '%'; bar.classList.toggle('hot', !!hot); }
        const pct = document.getElementById('p-' + g.slice(2));              // 环内百分比
        if (pct) { const p = Math.round(v) + '%'; if (pct.textContent !== p) pct.textContent = p; }
        const el = document.getElementById(vEl);
        const html = `<span class="v-full">${text}</span>` + (short ? `<span class="v-short">${short}</span>` : '');
        if (el.__kdHtml !== html) { el.innerHTML = html; el.__kdHtml = html; }   // 内容没变不重写，减少每秒无效 DOM 写入
      };
      setG('g-cpu', sys.cpu, 'v-cpu', sys.cpu + '%', sys.cpu > 90, sys.cpu + '%');
      if (sys.memTotal) {
        const mp = Math.min(100, sys.memUsed / sys.memTotal * 100);
        setG('g-mem', mp, 'v-mem', `${fmtBytes(sys.memUsed)} / ${fmtBytes(sys.memTotal)}`, mp > 90, Math.round(mp) + '%');
      }
      if (sys.diskTotal) {
        const dp = Math.min(100, sys.diskUsed / sys.diskTotal * 100);
        setG('g-disk', dp, 'v-disk', `${fmtBytes(sys.diskUsed)} / ${fmtBytes(sys.diskTotal)}`, dp > 90, Math.round(dp) + '%');
      }
      const netHtml = `<span class="v-full"><span class="net-down">↓</span> ${fmtRate(sys.netDown)} · <span class="net-up">↑</span> ${fmtRate(sys.netUp)}</span><span class="v-short"><span class="net-dn"><span class="net-down">↓</span>${fmtRate(sys.netDown).replace('/s', '')}</span><span class="net-upln"><span class="net-up">↑</span>${fmtRate(sys.netUp).replace('/s', '')}</span></span>`;
      const vNet = document.getElementById('v-net');
      if (vNet.__kdHtml !== netHtml) { vNet.innerHTML = netHtml; vNet.__kdHtml = netHtml; }
      // 双色圆环：绿弧=下行占比、红弧=上行占比
      const dnC = document.getElementById('g-net-down'), upC = document.getElementById('g-net-up');
      if (dnC && upC) {
        const tot = (sys.netDown || 0) + (sys.netUp || 0);
        let dPct = 0, uPct = 0;
        if (tot > 0) { dPct = Math.round(sys.netDown / tot * 100); uPct = 100 - dPct; }
        dnC.style.strokeDasharray = `${dPct} ${100 - dPct}`;
        upC.style.strokeDasharray = `${uPct} ${100 - uPct}`;
        upC.style.strokeDashoffset = String(-dPct);
      }
    }

    let rankMode = localStorage.getItem('kd_rank') === 'turn' ? 'turn' : 'tok';
    let lastRankKey = '';
    function renderRank(d) {
      const val = (s) => rankMode === 'turn' ? s.turnCountToday : totalTokens(s.usageToday);
      const rk = rankMode + '|' + d.sessions.map((s) => s.sessionId + ':' + s.turnCountToday + ':' + fmtTokens(totalTokens(s.usageToday))).join(',');
      if (rk === lastRankKey) return;
      lastRankKey = rk;
      const ranked = [...d.sessions].sort((a, b) => val(b) - val(a));
      const rmax = Math.max(1, ...ranked.map(val));
      const list = document.getElementById('rank-list');
      if (!ranked.length) { list.innerHTML = '<div class="empty">今日暂无会话</div>'; return; }
      list.innerHTML = ranked.map((s) => {
        const tok = totalTokens(s.usageToday);
        const name = esc(s.title.length > 14 ? s.title.slice(0, 14) + '…' : s.title);
        const sec = rankMode === 'turn' ? fmtTokens(tok) : s.turnCountToday + ' 轮';
        return `<div class="rank-row" data-sid="${esc(s.sessionId)}">`
          + `<div class="rank-top"><span class="n">${name}</span><span class="v">${fmtTokens(val(s))} · ${sec}</span></div>`
          + `<div class="bar"><i style="width:${val(s) / rmax * 100}%"></i></div></div>`;
      }).join('');
    }
    function setRankMode(m) {
      rankMode = m;
      localStorage.setItem('kd_rank', m);
      document.getElementById('rk-tok').classList.toggle('on', m === 'tok');
      document.getElementById('rk-turn').classList.toggle('on', m === 'turn');
      if (DATA) renderRank(DATA);
    }
    // 折叠：手机端卡片墙 + 侧栏面板（状态持久化）
    const tilesHead = document.getElementById('tiles-head');
    tilesHead.addEventListener('click', (e) => {
      if (!e.target.closest('.t')) return;   // 仅点击「会话列表」标题文字才折叠/展开
      const on = document.body.classList.toggle('tiles-collapsed');
      localStorage.setItem('kd_tc', on ? '1' : '0');
    });
    if (localStorage.getItem('kd_tc') === '1' && matchMedia('(max-width: 480px) and (orientation: portrait)').matches) document.body.classList.add('tiles-collapsed');

      document.querySelectorAll('.side .panel h3').forEach((h) => {
      h.addEventListener('click', (e) => {
        if (e.target.closest('.rank-sw') || e.target.closest('.add-btn')) return;
        const panel = h.closest('.panel');
        const on = panel.classList.toggle('collapsed');
        const store = JSON.parse(localStorage.getItem('kd_col') || '{}');
        store[panel.id] = on;
        localStorage.setItem('kd_col', JSON.stringify(store));
      });
    });
    function applyCollapsed() {
      const store = JSON.parse(localStorage.getItem('kd_col') || '{}');
      document.querySelectorAll('.side .panel').forEach((p) => {
        p.classList.toggle('collapsed', !!store[p.id]);
      });
    }
    applyCollapsed();

    document.getElementById('rk-tok').addEventListener('click', () => setRankMode('tok'));
    document.getElementById('rk-turn').addEventListener('click', () => setRankMode('turn'));
    document.getElementById('rank-list').addEventListener('click', (e) => {
      const row = e.target.closest('.rank-row');
      if (row && DATA) {
        const s = DATA.sessions.find((x) => x.sessionId === row.dataset.sid);
        if (s) enterSession(s);
      }
    });

    function fmtBytes(n) {
      if (n >= 2 ** 30) return (n / 2 ** 30).toFixed(1) + 'G';
      if (n >= 2 ** 20) return (n / 2 ** 20).toFixed(0) + 'M';
      if (n >= 1024) return (n / 1024).toFixed(0) + 'K';
      return String(n);
    }
    function fmtDur(ms) {
      const m = Math.floor(ms / 60000);
      if (m >= 60) return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
      if (m >= 1) return m + ' 分钟';
      return Math.max(1, Math.floor(ms / 1000)) + ' 秒';
    }
    function fmtRate(n) {
      if (!n) return '0';
      if (n >= 2 ** 20) return (n / 2 ** 20).toFixed(1) + 'M/s';
      if (n >= 1024) return (n / 1024).toFixed(0) + 'K/s';
      return n + 'B/s';
    }

    // ---- 交互：分组折叠 / 卡片详情 / APP 内跳会话 ----

    // APP（鸿蒙 WebView）内通过 JS 桥跳转原生会话页；桌面浏览器保持点卡片看详情
    function isNativeApp() {
      return typeof window.kimiNative !== 'undefined' && window.kimiNative !== null
        && typeof window.kimiNative.openSession === 'function';
    }
    function sessionUrl(sid) {
      const base = DATA && DATA.webBase ? String(DATA.webBase) : '';
      if (!base) return '';
      const url = base.replace(/\/+$/, '') + '/sessions/' + sid;
      // 兜底地址若为本机环回（127.0.0.1/localhost），在非本机访问（手机经隧道）时不可达，
      // 改走看板同源反代路径（经隧道可达，带令牌）
      try {
        const bh = new URL(base).hostname;
        const loopback = ['127.0.0.1', 'localhost', '0.0.0.0', '::1'].includes(bh);
        if (loopback && location.hostname !== bh) {
          // 原生子进程需要绝对地址（App 外壳打开），网页 iframe 相对地址即可
          return location.origin + '/sessions/' + sid + '?k=' + encodeURIComponent(fbToken || '');
        }
      } catch (err) {}
      return url;
    }

    // ---- 右侧会话面板：多标签（会话卡片/文件树均新开标签），左侧看板保留 ----
    const spPane = document.getElementById('session-pane');
    const spLoading = document.getElementById('sp-loading');
    let spUrl = '';     // 当前激活会话标签的 URL（兼容旧引用）
    let spSid = '';     // 当前激活会话标签的会话 ID
    let spTabs = [];    // {id, kind: 'session'|'file', title, url, sid?, path?}
    let spActive = '';
    let spTabSeq = 0;
    const spViews = {}; // 标签 id -> 容器
    function spMarkSel() {
      document.querySelectorAll('#tiles .card.sel').forEach((c) => c.classList.remove('sel'));
      const t = spTabs.find((x) => x.id === spActive && x.kind === 'session');
      if (!t || document.body.classList.contains('sp-collapsed')) return;
      const c = document.querySelector(`#tiles .card[data-sid="${CSS.escape(t.sid)}"]`);

          body.innerHTML = '<div class="fb-empty">该类型不支持预览 · 可下载查看</div>';
          return;

    // PDF 标签页：pdf.js 连续渲染全部页，占满整个预览区
    async function spRenderPdfInto(t, v) {
      const body = v.querySelector('.sp-fbody');
      body.innerHTML = '<div class="fb-empty">加载 PDF…</div>';
      try { await loadVendor('pdfjs'); } catch (e) {
        if (spTabs.includes(t)) body.innerHTML = '<div class="fb-empty">组件加载失败，请下载查看</div>';
        return;
      }
      if (!spTabs.includes(t)) return;
      let data;
      try {
        let r = await fetch(fbRawUrl(t.path));
        if (r.status === 401) {
          const tk = await askFbToken();
          if (!tk) throw new Error('HTTP 401');
          fbToken = tk;
          r = await fetch(fbRawUrl(t.path));
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        data = await r.arrayBuffer();
      } catch (e) {
        if (spTabs.includes(t)) body.innerHTML = '<div class="fb-empty">加载失败: ' + esc(e.message) + '</div>';
        return;
      }
      if (!spTabs.includes(t)) return;
      let doc;
      try { doc = await pdfjsLib.getDocument({ data }).promise; }
      catch (e) {
        if (spTabs.includes(t)) body.innerHTML = '<div class="fb-empty">PDF 解析失败 · 可下载查看</div>';
        return;
      }
      if (!spTabs.includes(t)) { try { doc.destroy(); } catch (e) {} return; }
      if (t.pdfDoc) { try { t.pdfDoc.destroy(); } catch (e) {} }
      t.pdfDoc = doc;
      const wrap = document.createElement('div');
      wrap.className = 'fb-pdfwrap';
      const note = document.createElement('div');
      note.className = 'fb-note';
      body.innerHTML = '';
      body.appendChild(wrap);
      body.appendChild(note);
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const total = Math.min(doc.numPages, 200);   // 超长文档上限 200 页
      const renderPage = async (i) => {
        if (!spTabs.includes(t)) return false;
        const page = await doc.getPage(i);
        if (!spTabs.includes(t)) return false;
        const vp1 = page.getViewport({ scale: 1 });
        const w = Math.max(280, (wrap.clientWidth || 600) - 20);
        const viewport = page.getViewport({ scale: w / vp1.width * dpr });
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.className = 'fb-pdfpage';
        canvas.style.width = Math.floor(viewport.width / dpr) + 'px';
        wrap.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        note.textContent = '渲染中 ' + i + '/' + total + ' 页 · 共 ' + doc.numPages + ' 页';
        return true;
      };
      for (let i = 1; i <= total; i++) {
        if (!await renderPage(i)) return;
        if (i % 5 === 0) await new Promise((r) => setTimeout(r, 0));   // 让出主线程
      }
      if (!spTabs.includes(t)) return;
      note.textContent = '共 ' + doc.numPages + ' 页' + (doc.numPages > total ? ' · 已渲染前 ' + total + ' 页' : '') + ' · 连续滚动查看';
    }

    function fbApi(action, params, opts) {

    function askFbToken(title) {

          '<div style="font-size:11.5px;color:var(--dim);margin-bottom:10px">文件读写需验证令牌（防公网直接访问本机文件）。令牌在 Mac 上查看：<br><code style="font-family:var(--mono);font-size:10.5px">cat ~/05-Codes/kimi/kimi-dashboard/.filetoken</code></div>' +
          '<input id="fb-token-input" class="todo-input" placeholder="粘贴访问令牌…" autocomplete="off">' +
          '<button id="fb-token-ok" class="todo-submit">确定</button>');
        const ov = document.getElementById('pop-overlay');
        const mo = new MutationObserver(() => { done(null); });
        mo.observe(ov, { attributes: true, attributeFilter: ['class'] });

        input.focus();

          const v = input.value.trim();
          if (!v) return;

          try { localStorage.setItem('kd_ftoken', v); } catch (e) {}
          done(v);

    // 工作空间清单 = 会话 cwd 去重；随 SSE 的 render() 同步，菜单签名不变时零开销
    function updateFbWorkspaces(d) {

    // ---- 文件树：目录折叠展开（懒加载），不换页 ----

    let fbTreeRoot = '';

    async function fbTreeLoad(path) {

    async function fbToggleDir(p) {

      try { await fbTreeLoad(p); } catch (e) { fbTree.children[p] = []; }

    async function fbTreeRefresh() {
      if (!fbTreeRoot) return;

        .filter((p) => p !== fbTreeRoot)
        .sort((a, b) => a.split('/').length - b.split('/').length)];
      fbTree.children = {};
      for (const d of dirs) {
        try { await fbTreeLoad(d); } catch (e) { fbTree.children[d] = []; }
      }

    function fbIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'ico'].includes(ext)) return '▣';
      if (ext === 'pdf') return '▤';
      if (ext === 'md') return '§';
      if (['zip', 'gz', 'tgz', 'tar'].includes(ext)) return '▦';
      return '≡';

    function renderFbTree() {
      const rows = document.getElementById('fb-rows');
      if (!fbTreeRoot) { rows.innerHTML = '<div class="empty">暂无可用工作空间</div>'; return; }
      let html = '';
      const walk = (path, depth) => {
        for (const x of fbTree.children[path] || []) {
          const p = path + '/' + x.name;
          const pad = 8 + depth * 16;
          if (x.isDir) {
            const open = fbTree.expanded.has(p);
            html += `<div class="fb-row dir" data-p="${esc(p)}" data-dir="1" style="padding-left:${pad}px">`
              + `<span class="ic fb-caret">${open ? '▾' : '▸'}</span><span class="nm">${esc(x.name)}</span>`
              + `<span class="mt">${fmtAgo(x.mtime)}</span></div>`;
            if (open) {
              if (fbTree.children[p]) walk(p, depth + 1);
              else html += `<div class="fb-row" style="padding-left:${pad + 22}px"><span class="nm">加载中…</span></div>`;
            }
          } else {
            html += `<div class="fb-row" data-p="${esc(p)}" data-dir="0" style="padding-left:${pad}px">`
              + `<span class="ic">${fbIcon(x.name)}</span><span class="nm">${esc(x.name)}</span>`
              + `<span class="sz">${fmtBytes(x.size)}</span>`
              + `<span class="mt">${fmtAgo(x.mtime)}</span></div>`;
          }
        }
      };
      walk(fbTreeRoot, 0);
      rows.innerHTML = html || '<div class="empty">空目录</div>';
    }


    function fbRawUrl(p, dl) {
      return 'kd/file/raw/' + encodeURIComponent(basename(p) || 'file')
        + '?path=' + encodeURIComponent(p) + (dl ? '&dl=1' : '')
        + (fbToken ? '&k=' + encodeURIComponent(fbToken) : '');
    }
    async function fbDownload(p) {
      // 原生 App：走 kimiNative.downloadFile 桥（WebView 无下载能力，原生 http+保存对话框）
      try {
        if (isNativeApp() && window.kimiNative && typeof window.kimiNative.downloadFile === 'function') {
          window.kimiNative.downloadFile(new URL(fbRawUrl(p, true), location.href).href, basename(p));
          return;
        }
      } catch (e) { /* 桥失败回退网页下载 */ }
      // 浏览器：blob 方式触发下载（WebView 兼容 + 令牌可控），失败回退直链
      const trigger = (href, revoke) => {
        const a = document.createElement('a');
        a.href = href;
        a.download = basename(p);
        document.body.appendChild(a);
        a.click();
        a.remove();
        if (revoke) setTimeout(() => { try { URL.revokeObjectURL(href); } catch (e) {} }, 60000);
      };
      try {
        let r = await fetch(fbRawUrl(p, true));
        if (r.status === 401) {
          const t = await askFbToken();
          if (!t) return;
          fbToken = t;
          r = await fetch(fbRawUrl(p, true));
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const len = +(r.headers.get('Content-Length') || 0);
        if (len > 200 * 1024 * 1024) { trigger(fbRawUrl(p, true)); return; }   // 超大文件不进内存
        trigger(URL.createObjectURL(await r.blob()), true);
      } catch (e) {
        trigger(fbRawUrl(p, true));
      }
    }

    // vendor 懒加载（Promise 缓存；失败可重试并降级）
    const fbVendors = {};
    function loadVendor(kind) {
      if (fbVendors[kind]) return fbVendors[kind];
      fbVendors[kind] = new Promise((resolve, reject) => {
        if (kind === 'hljs' && !document.getElementById('fb-hl-theme')) {

        if (kind === 'xterm' && !document.getElementById('vd-xterm-css')) {

    // md 渲染态代码块高亮：```语言标注优先，无标注且无中文时自动检测
    // md 渲染态代码块高亮核心（作用域化：看板预览/右侧文件标签共用）
    function fbHighlightMdBlocks(root) {
      loadVendor('hljs').then(() => {
        if (!window.hljs) return;
        root.querySelectorAll('.md-code').forEach((pre) => {
          if (pre.dataset.hlDone) return;
          pre.dataset.hlDone = '1';
          const codeEl = pre.querySelector('code');
          if (!codeEl) return;
          const lang = (pre.dataset.lang || '').toLowerCase();
          try {
            if (lang && hljs.getLanguage(lang)) {
              codeEl.innerHTML = hljs.highlight(codeEl.textContent, { language: lang }).value;
              pre.classList.add('hl');
            } else if (!lang && !/[\u4e00-\u9fff]/.test(codeEl.textContent)) {
              codeEl.innerHTML = hljs.highlightAuto(codeEl.textContent).value;

    // 源码高亮核心（作用域化：按扩展名映射语言，带 .fb-src 深色底）

    // Excel/CSV：SheetJS → sheet 标签 + 表格

    // ---- 文件编辑：textarea + baseMtime 冲突检测 ----
    // 内置迷你 Markdown 渲染器（标题/粗斜体/行内码/代码块/表格/列表/任务/引用/链接/分隔线）
    function mdRender(src) {
      const blocks = [];
      src = src.replace(/```([^\n]*)\n([\s\S]*?)```/g, (m, info, code) => {
        const lang = (info.trim().split(/\s+/)[0] || '').toLowerCase();
        blocks.push({ lang, html: '<pre class="md-code"' + (lang ? ` data-lang="${esc(lang)}"` : '')
          + '><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>' });
        return '\u0000B' + (blocks.length - 1) + '\u0000';
      });
      const inline = (s) => esc(s)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
        .replace(/\*([^*]+)\*/g, '<i>$1</i>')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      // 表格块（| a | b | + |---|---| 分隔行），渲染成真表格后以占位符回插
      src = src.replace(/((?:^[ \t]*\|.*\|[ \t]*$\n?)+)/gm, (raw) => {
        const lines = raw.trim().split('\n').map((l) => l.trim());
        if (lines.length < 2) return raw;
        const sep = lines[1];
        if (!/^\|?[\s:|-]+\|[\s:|-]*$/.test(sep) || !/-/.test(sep)) return raw;
        const cells = (row) => row.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
        const aligns = sep.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => {
          const t = c.trim();
          if (/^:-+:$/.test(t)) return 'center';
          if (/^-+:$/.test(t)) return 'right';
          return '';
        });
        const cellHtml = (c, i, tag) => {
          const a = aligns[i] ? ` style="text-align:${aligns[i]}"` : '';
          return `<${tag}${a}>${inline(c)}</${tag}>`;
        };
        const head = cells(lines[0]);
        const rows = lines.slice(2).map((l) => cells(l));
        const MAXR = 500;
        let html = '<table class="md-table"><thead><tr>'
          + head.map((c, i) => cellHtml(c, i, 'th')).join('') + '</tr></thead><tbody>'
          + rows.slice(0, MAXR).map((r) => '<tr>' + head.map((_, i) => cellHtml(r[i] != null ? r[i] : '', i, 'td')).join('') + '</tr>').join('');
        if (rows.length > MAXR) html += `<tr><td colspan="${head.length}">…共 ${rows.length} 行，仅显示前 ${MAXR} 行</td></tr>`;
        blocks.push({ html: html + '</tbody></table>' });
        return '\u0000B' + (blocks.length - 1) + '\u0000';
      });
      let html = '', list = null;
      const closeList = () => { if (list) { html += list === 'ol' ? '</ol>' : '</ul>'; list = null; } };
      for (const raw of src.split('\n')) {
        const s = raw.trim();
        let m;
        if ((m = s.match(/^(#{1,4})\s+(.*)$/))) { closeList(); const lv = m[1].length + 2; html += `<h${lv}>` + inline(m[2]) + `</h${lv}>`; continue; }
        if (/^([-*_]\s*){3,}$/.test(s)) { closeList(); html += '<hr>'; continue; }
        if ((m = s.match(/^&gt;\s?(.*)$/)) || (m = s.match(/^>\s?(.*)$/))) { closeList(); html += '<blockquote>' + inline(m[1]) + '</blockquote>'; continue; }
        if ((m = s.match(/^[-*]\s+\[([ xX])\]\s+(.*)$/))) {
          if (list !== 'ul') { closeList(); html += '<ul class="md-tasks">'; list = 'ul'; }
          html += `<li class="${m[1] === ' ' ? '' : 'done'}"><span class="ck"></span>` + inline(m[2]) + '</li>';
          continue;
        }
        if ((m = s.match(/^[-*]\s+(.*)$/))) { if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
        if ((m = s.match(/^\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
        closeList();
        if (!s) continue;
        html += '<p>' + inline(s) + '</p>';
      }
      closeList();
      html = html.replace(/\u0000B(\d+)\u0000/g, (m, i) => blocks[+i].html);
      return html;
    }

    const pullTip = document.getElementById('pull-tip');
    let pullDist = 0;
    const PULL_THRESHOLD = 70;
    function atTop() {
      const tiles = document.getElementById('tiles');
      return (window.scrollY || document.documentElement.scrollTop || 0) <= 0
        && (!tiles || tiles.scrollTop <= 0);
    }
    let pullLastY = null;
    document.addEventListener('touchstart', (e) => {
      if (!isFullscreen() || e.touches.length !== 1) return;
      pullLastY = e.touches[0].clientY;
      pullDist = 0;
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (pullLastY === null) return;
      const curY = e.touches[0].clientY;
      const delta = curY - pullLastY;
      pullLastY = curY;
      // 只有到达顶部且继续下拉才累积；未到顶时交还给正常滚动
      if (!atTop() || delta <= 0) {
        if (!atTop()) pullDist = 0;
        pullTip.classList.remove('visible', 'ready');
        return;
      }
      pullDist = Math.min(pullDist + delta * 0.55, 120); // 阻尼累积，支持"滚到顶后顺势下拉"
      pullTip.classList.add('visible');
      pullTip.classList.toggle('ready', pullDist >= PULL_THRESHOLD);
      pullTip.textContent = pullDist >= PULL_THRESHOLD ? '松手刷新' : '↓ 下拉刷新';
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchend', async () => {
      if (pullLastY === null) return;
      const should = pullDist >= PULL_THRESHOLD;
      pullLastY = null; pullDist = 0;
      if (!should) { pullTip.classList.remove('visible', 'ready'); return; }
      pullTip.classList.remove('ready');
      pullTip.innerHTML = '<span class="sp">↻</span> 刷新中…';
      const minSpin = new Promise((r) => setTimeout(r, 700));
      try {
        await Promise.all([refresh(), minSpin]);
      } finally {

    try { if (typeof trailingTimer !== 'undefined' && trailingTimer) clearTimeout(trailingTimer); } catch (err) {}
  };
</script>
<div class="pop-overlay" id="pop-overlay"><div class="pop panel" id="pop"></div></div>
<script>
// 看门狗：与主脚本相互独立。主脚本崩溃/卡死（心跳停止 120s 且页面可见）→ 整页刷新自愈
(function () {
  window.__kdAlive = Date.now();
  setInterval(function () {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - window.__kdAlive > 120000) { location.reload(); }
  }, 10000);
})();
</script>
